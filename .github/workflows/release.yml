name: Automatic Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare release
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-22.04

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Calculate next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          LAST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1)

          if [ -z "$LAST_TAG" ]; then
            echo "No previous release tag found."

            VERSION=$(node <<'NODE'
          const fs = require("fs");

          const path = "src-tauri/tauri.conf.json";

          const config = JSON.parse(
            fs.readFileSync(path, "utf8")
          );

          if (!config.version) {
            throw new Error(
              "version is missing from src-tauri/tauri.conf.json"
            );
          }

          console.log(config.version);
          NODE
            )
          else
            echo "Latest release: $LAST_TAG"

            CURRENT="${LAST_TAG#v}"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

            if [ -z "${MAJOR:-}" ] || \
               [ -z "${MINOR:-}" ] || \
               [ -z "${PATCH:-}" ]; then
              echo "Invalid semantic version: $CURRENT"
              exit 1
            fi

            PATCH=$((PATCH + 1))

            VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Next version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update Tauri version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const path = "src-tauri/tauri.conf.json";

          const config = JSON.parse(
            fs.readFileSync(path, "utf8")
          );

          config.version = process.env.VERSION;

          fs.writeFileSync(
            path,
            JSON.stringify(config, null, 2) + "\n"
          );

          console.log(
            `Updated Tauri version to ${process.env.VERSION}`
          );
          NODE

      - name: Update Cargo version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if [ -f "src-tauri/Cargo.toml" ]; then
            sed -i -E \
              "0,/^version = \".*\"/s//version = \"${VERSION}\"/" \
              src-tauri/Cargo.toml

            echo "Updated src-tauri/Cargo.toml to ${VERSION}"
          fi

      - name: Update package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");

          const path = "package.json";

          if (!fs.existsSync(path)) {
            process.exit(0);
          }

          const pkg = JSON.parse(
            fs.readFileSync(path, "utf8")
          );

          pkg.version = process.env.VERSION;

          fs.writeFileSync(
            path,
            JSON.stringify(pkg, null, 2) + "\n"
          );

          console.log(
            `Updated package.json to ${process.env.VERSION}`
          );
          NODE

      - name: Commit version changes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            src-tauri/tauri.conf.json \
            src-tauri/Cargo.toml \
            package.json

          git commit \
            -m "chore: bump version to ${VERSION}" \
            || echo "No changes to commit"

          git push

  release:
    name: Build release

    needs: prepare

    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: windows-latest

          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            file

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          tagName: v__VERSION__

          releaseName: "Null Launcher v__VERSION__"

          releaseBody: |
            ## Null Launcher v__VERSION__

            Automatic release generated from master.

            ### Downloads

            #### Windows
            - `.exe`
            - `.msi`

            #### Linux
            - `.AppImage` — recommended
            - `.deb` — Debian/Ubuntu based systems

          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
